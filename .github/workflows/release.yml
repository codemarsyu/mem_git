name: MemGit Release (macOS & Linux Packages)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version tag label (defaults to ref_name)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python3 -m pip install --upgrade pip build
      - name: Build & verify wheel + sdist
        run: bash packaging/build_wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: |
            dist/*.whl
            dist/*.tar.gz

  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python3 -m pip install --upgrade pip pyinstaller
      - name: Build standalone binary & tarball
        env:
          BUILD_MODE: pyinstaller
        run: bash packaging/build_binary.sh
      - name: Build macOS .pkg installer
        env:
          APPLE_INSTALLER_CERT: ${{ secrets.APPLE_INSTALLER_CERT }}
        run: bash packaging/build_macos_pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/memgit-*-darwin-*.tar.gz
            dist/memgit-*-darwin-*.tar.gz.sha256
            dist/memgit-*-darwin-*.pkg
            dist/memgit-*-darwin-*.pkg.sha256

  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller & nfpm
        run: |
          python3 -m pip install --upgrade pip pyinstaller
          NFPM_VER="2.40.0"
          NFPM_ARCH="$([[ "${{ matrix.arch }}" == "arm64" ]] && echo "arm64" || echo "x86_64")"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_${NFPM_ARCH}.tar.gz" | sudo tar -xz -C /usr/local/bin nfpm
      - name: Build standalone binary & tarball
        env:
          BUILD_MODE: pyinstaller
        run: bash packaging/build_binary.sh
      - name: Build Linux .deb & .rpm packages
        run: bash packaging/build_linux_pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/memgit-*-linux-*.tar.gz
            dist/memgit-*-linux-*.tar.gz.sha256
            dist/memgit_*.deb
            dist/memgit_*.deb.sha256
            dist/memgit-*.rpm
            dist/memgit-*.rpm.sha256

  publish-release:
    needs: [ build-wheel, build-macos, build-linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true
      - name: Generate combined SHA256SUMS and Homebrew formula
        run: |
          VERSION="$(python3 -c 'import memgit; print(memgit.__version__)')"
          cd release_assets
          sha256sum *.whl *.tar.gz *.pkg *.deb *.rpm > SHA256SUMS
          SHA_MAC_ARM="$(grep 'darwin-arm64.tar.gz' SHA256SUMS | awk '{print $1}')"
          SHA_MAC_X64="$(grep 'darwin-x86_64.tar.gz' SHA256SUMS | awk '{print $1}')"
          SHA_LIN_X64="$(grep 'linux-x86_64.tar.gz' SHA256SUMS | awk '{print $1}')"
          SHA_LIN_ARM="$(grep 'linux-arm64.tar.gz' SHA256SUMS | awk '{print $1}')"
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256_DARWIN_ARM64__/${SHA_MAC_ARM}/g" \
            -e "s/__SHA256_DARWIN_X86_64__/${SHA_MAC_X64}/g" \
            -e "s/__SHA256_LINUX_X86_64__/${SHA_LIN_X64}/g" \
            -e "s/__SHA256_LINUX_ARM64__/${SHA_LIN_ARM}/g" \
            ../packaging/homebrew/memgit.rb.tmpl > memgit.rb
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_assets/*.whl
            release_assets/*.tar.gz
            release_assets/*.pkg
            release_assets/*.deb
            release_assets/*.rpm
            release_assets/SHA256SUMS
            release_assets/memgit.rb
