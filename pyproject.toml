[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memgit"
version = "0.2.0"
description = "MemGit: Cross-Agent & Cross-Machine AI Coding Agent Memory Checkpoint, Transform, and Resume CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "MemGit Team" }
]
keywords = ["ai", "agents", "claude", "gemini", "antigravity", "codex", "cursor", "cli", "memory", "handoff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/codemarsyu/mem_git"
Repository = "https://github.com/codemarsyu/mem_git"
Issues = "https://github.com/codemarsyu/mem_git/issues"

[project.scripts]
memgit = "memgit.cli:main"

[tool.setuptools.packages.find]
include = ["memgit*"]
